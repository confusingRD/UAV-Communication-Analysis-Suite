[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "uav-cas"
version = "0.1.0"
description = "Refractivity-aware UAV communication analysis and reporting"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = []

[project.optional-dependencies]
demo = ["numpy>=2.1,<3", "matplotlib>=3.9,<4"]
reporting = ["numpy>=2.1,<3", "matplotlib>=3.9,<4", "streamlit>=1.40,<2"]
test = ["pytest>=8,<10", "numpy>=2.1,<3", "matplotlib>=3.9,<4"]
packaging-smoke = ["PySide6>=6.8,<7", "PyInstaller>=6.11,<7"]

[project.scripts]
uav-cas-atmosphere-demo = "uav_cas.demo:main"
uav-cas-phase2a-demo = "uav_cas.phase2a_demo:main"
uav-cas-phase2b-demo = "uav_cas.phase2b_demo:main"
uav-cas-report = "uav_cas.reporting_cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["uav_cas*"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src"]

