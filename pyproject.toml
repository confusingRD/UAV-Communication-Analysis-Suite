[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "uav-cas"
version = "0.1.0"
description = "UAV Communication Analysis Suite scientific foundations"
requires-python = ">=3.11,<3.14"
dependencies = ["cubesat-link==0.2.0"]

[project.optional-dependencies]
demo = ["numpy>=2.1,<3", "matplotlib>=3.9,<4"]
test = ["pytest>=8,<10"]
packaging-smoke = ["PySide6>=6.8,<7", "PyInstaller>=6.11,<7"]

[project.scripts]
uav-cas-atmosphere-demo = "uav_cas.demo:main"
uav-cas-phase2a-demo = "uav_cas.phase2a_demo:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests", "packages/cubesat-link/tests"]
pythonpath = ["src", "packages/cubesat-link"]

