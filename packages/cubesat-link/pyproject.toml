[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cubesat-link"
version = "0.2.0"
description = "Reusable UAV and satellite radio propagation with explicit data provenance"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
cubesat-link = "cubesat_link.cli:main"

[tool.setuptools]
packages = ["cubesat_link"]

[tool.setuptools.package-data]
cubesat_link = ["*.schema.json"]
